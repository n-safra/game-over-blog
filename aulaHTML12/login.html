<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre na sua conta do Game Over Blog.">
    <title>Login | Game Over Blog</title>

    <!-- Estilos do site + estilos da tela de login -->
    <link rel="stylesheet" href="../static/css/styles.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <!-- Cabeçalho: logo e navegação (igual em todas as páginas) -->
    <header>
        <a href="../index.html" class="logo">Game Over <span>Blog</span></a>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../blog.html">Blog</a></li>
                <li><a href="../sobre.html">Sobre</a></li>
                <li><a href="login.html" class="ativo" aria-current="page">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="pagina-login">
        <section class="caixa-login">
            <h1>Entrar</h1>
            <p class="subtitulo">Acesse sua conta do Game Over Blog</p>

            <!-- action: para onde os dados seriam enviados | method: forma de envio (GET ou POST) -->
            <form id="formLogin" action="#" method="post" novalidate>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">
                    <span class="erro" id="erroEmail"></span>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <!-- type="password" deixa a senha oculta -->
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
                    <span class="erro" id="erroSenha"></span>
                </div>

                <div class="opcoes">
                    <label class="mostrar">
                        <input type="checkbox" id="mostrarSenha"> Mostrar senha
                    </label>
                    <a href="#">Esqueci minha senha</a>
                </div>

                <button type="submit">Entrar</button>

                <p class="mensagem" id="mensagem"></p>
            </form>

            <p class="cadastro">Não tem conta? <a href="#">Cadastre-se</a></p>
        </section>
    </main>

    <!-- Rodapé (igual em todas as páginas) -->
    <footer>
        <p>&copy; 2026 Game Over Blog - Nicolas Safra Gazige</p>
        <p><a href="../sobre.html">Fale conosco</a></p>
    </footer>

    <script src="login.js"></script>
</body>
</html>
